
blueprint:
  name: PV Heating Rod Automation
  description: |
    Version 3.1
    Controls up to three heating rods based on actual PV feed-in surplus.

    Stage thresholds are computed automatically from the configured rod capacities.
    Equal-capacity rods are handled correctly — duplicate power levels are collapsed
    into a single stage, so e.g. 3 × 2 kW rods yield three clean stages (2 / 4 / 6 kW)
    instead of six partially overlapping ones.

    Recommended sensor: EMMA "Feed in power" (what is currently going to the grid).
    This ensures the battery always has priority — heating rods only run on true excess.

    Features:
    - Dynamic stage table: derived from rod capacities (kW each), not manual thresholds.
      Equal-power combinations are automatically merged; fewest rods wins.
    - 1–3 rods supported: Rod 2 and Rod 3 are optional.
    - Asymmetric switching: stages up immediately on surplus; stage-down suppressed when
      SOC >= 90% and stage > Stage 1. Battery absorbs surplus dips without switching off.
    - Hysteresis: configurable deadband prevents oscillation around thresholds.
    - Battery capacity (kWh): displayed in log messages alongside SOC%.
    - Failsafe shutdown: at end_time or when battery SOC drops below minimum.
    - Correct switching sequence: always turn OFF first, then ON.
    - Buffer tank temperature sensor (optional): when the buffer reaches a configurable
      temperature threshold, the retry wait after a thermostated shutdown is extended
      from 15 to 60 minutes — prevents rapid cycling when the buffer is already hot.
    - Logbook entries on stage changes, failsafe shutdowns, emergency shutdowns, and buffer tank events.
    - Lock time respected via mode: single.

    Known limitations:
    - Wear leveling across equal-capacity rods: the same rod combination is always
      selected for a given power level (fewest-rods-first, stable sort order).
      Swap the physical rod assignments to redistribute wear manually.
    - Overnight time windows (e.g. 23:00–01:00) are not supported.
    - Stage-down (Stage 2+) is held until SOC drops below 90% when battery is full.
      During a cloud shadow the battery compensates the shortfall — this is intentional.
    - The grid-import kill-switch cannot interrupt an active lock delay (mode: single).
      Keep lock time low (default 5 min). For a real-time guard add a separate automation.

  domain: automation
  source_url: "https://raw.githubusercontent.com/4gismo/homeassistant-blueprints/main/automation/pv_heating_rod/blueprint.yaml"

  input:
    sensors_section:
      name: Sensors
      input:
        surplus_sensor:
          name: PV Surplus Sensor
          description: >
            Sensor measuring power flow at the grid connection point, in watts.
            For Huawei EMMA: use "Feed in power".
            Configure the sign convention below.
          selector:
            entity:
              domain: sensor
              device_class: power

        surplus_sensor_inverted:
          name: Surplus Sensor Sign Convention
          description: >
            Positive (e.g. SMA, SolarEdge export sensors): value > 0 when feeding to grid.
            Negative (e.g. Huawei EMMA "Feed in power"): value < 0 when feeding to grid.
          default: false
          selector:
            boolean: {}

        battery_soc_sensor:
          name: Battery SOC Sensor
          description: >
            Sensor for battery state of capacity (0–100 %).
            For Huawei systems: use EMMA "State of capacity".
          selector:
            entity:
              domain: sensor
              device_class: battery

        grid_sensor:
          name: Grid Power Sensor (optional but strongly recommended)
          description: >
            Measures current grid power flow. Convention: positive = importing from grid.
            When configured, ALL rods are immediately shut down if grid import exceeds
            the threshold below — regardless of lock delays or any other state.
            Leave empty to disable (not recommended).
          default: {}
          selector:
            entity:
              domain: sensor
              device_class: power

        max_grid_import:
          name: Maximum Tolerated Grid Import (W)
          description: >
            Emergency shutdown triggers if grid import exceeds this value.
            Recommended: 100–200 W above typical measurement noise.
          default: 150
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: W
              step: 50

    heating_rods_section:
      name: Heating Rods
      input:
        switch_p1:
          name: Switch — Heating Rod 1
          selector:
            entity:
              domain: switch

        rod_1_capacity_kw:
          name: Rod 1 Capacity (kW)
          default: 2.0
          selector:
            number:
              min: 0.5
              max: 9.0
              step: 0.5
              unit_of_measurement: kW

        switch_p2:
          name: Switch — Heating Rod 2 (optional)
          description: Leave empty if you only have one rod.
          default: {}
          selector:
            entity:
              domain: switch

        rod_2_capacity_kw:
          name: Rod 2 Capacity (kW)
          default: 2.0
          selector:
            number:
              min: 0.5
              max: 9.0
              step: 0.5
              unit_of_measurement: kW

        switch_p3:
          name: Switch — Heating Rod 3 (optional)
          description: Leave empty if you only have two rods.
          default: {}
          selector:
            entity:
              domain: switch

        rod_3_capacity_kw:
          name: Rod 3 Capacity (kW)
          default: 2.0
          selector:
            number:
              min: 0.5
              max: 9.0
              step: 0.5
              unit_of_measurement: kW

    operation_section:
      name: Operation Settings
      input:
        start_time:
          name: Automation Start Time
          default: "09:00:00"
          selector:
            time: {}

        end_time:
          name: Automation End Time
          default: "18:00:00"
          selector:
            time: {}

        battery_limit:
          name: Minimum Battery SOC (%)
          description: Heating rods are disabled when battery SOC drops below this value.
          default: 60
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              step: 5

        battery_capacity_kwh:
          name: Battery Capacity (kWh)
          description: >
            Total usable battery capacity in kWh.
            Used for informational display in log messages (shows available kWh alongside SOC%).
            Does not affect switching logic — use Minimum Battery SOC for that.
          default: 10.0
          selector:
            number:
              min: 1.0
              max: 200.0
              step: 0.5
              unit_of_measurement: kWh

        hysteresis_watts:
          name: Hysteresis (W)
          description: >
            Surplus must drop this many watts below a stage threshold before switching down.
            Increase to reduce oscillation on unstable surplus sensors.
            Example with 700 W: a 2 kW stage activates at 2000 W, deactivates below 1300 W.
          default: 700
          selector:
            number:
              min: 0
              max: 1000
              unit_of_measurement: W
              step: 50

        lock_time_after_switching:
          name: Lock Time After Switching (minutes)
          description: >
            After a stage change, new sensor triggers are ignored for this duration.
            Increase to reduce oscillation.
          default: 5
          selector:
            number:
              min: 1
              max: 10
              unit_of_measurement: min
              step: 1

    power_monitoring_section:
      name: Power Monitoring (Optional)
      collapsed: true
      input:
        switch_p1_power:
          name: Power Sensor for Rod 1 (optional)
          description: >
            Power consumption sensor for heating rod 1 (e.g. Nous D3T).
            When configured, the automation detects when the rod's internal thermostat
            cuts out (buffer tank full) and retries after a wait (15 min by default;
            60 min when a buffer temperature sensor is configured and above the threshold).
            Leave empty if no power monitoring is available.
          default: {}
          selector:
            entity:
              domain: sensor
              device_class: power

        switch_p2_power:
          name: Power Sensor for Rod 2 (optional)
          default: {}
          selector:
            entity:
              domain: sensor
              device_class: power

        switch_p3_power:
          name: Power Sensor for Rod 3 (optional)
          default: {}
          selector:
            entity:
              domain: sensor
              device_class: power

        thermostat_cutoff_threshold:
          name: Thermostat Cutoff Threshold (W)
          description: >
            A rod is considered thermostated off when its measured power drops below
            this value. Default 50 W covers standby draw and measurement noise.
          default: 50
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: W
              step: 10

    buffer_temp_section:
      name: Buffer Tank Temperature (Optional)
      collapsed: true
      input:
        buffer_temp_sensor:
          name: Buffer Tank Temperature Sensor (optional)
          description: >
            Temperature sensor for the buffer tank, typically the lowest sensor
            (e.g. "Pufferspeicher unten"). When no rod current is detected for
            2+ minutes and this sensor reads at or above the threshold below,
            the retry wait is extended to 60 minutes instead of 15.
            Requires at least one Power Sensor to be configured above.
            Leave empty to keep the standard 15-minute retry wait.
          default: {}
          selector:
            entity:
              domain: sensor
              device_class: temperature

        buffer_temp_threshold:
          name: Buffer Threshold Temperature (°C)
          description: >
            When the buffer sensor is at or above this value during a thermostated
            shutdown, the retry wait is extended to 60 minutes. Set this to the
            temperature below which the buffer has cooled enough to absorb more heat —
            typically 5–10 °C below the rod's thermostat cutoff
            (e.g. 55 °C when the thermostat cuts at 60 °C).
          default: 55
          selector:
            number:
              min: 30
              max: 85
              step: 1
              unit_of_measurement: "°C"

    logging_section:
      name: Logging
      collapsed: true
      input:
        enable_logging:
          name: Enable Logging
          description: >
            When enabled, stage changes and all shutdowns are written to the Home Assistant Logbook.
          default: true
          selector:
            boolean: {}

trigger:
  - platform: state
    entity_id: !input surplus_sensor
    id: "sensor"
  - platform: state
    entity_id: !input battery_soc_sensor
    id: "sensor"
  # Grid sensor: fires only when import crosses the emergency threshold (not on every update)
  - platform: numeric_state
    entity_id: !input grid_sensor
    above: !input max_grid_import
    id: "grid_import"
  - platform: time_pattern
    minutes: "/5"
    id: "periodic"
  - platform: time
    at: !input end_time
    id: "boundary"
  - platform: time
    at: !input start_time
    id: "boundary"
  # Power monitoring triggers
  # below threshold for 2 min: sustained zero-draw — triggers buffer-full retry cycle check
  # above threshold for 15 s: rod resumed heating — triggers resume log
  - platform: numeric_state
    entity_id: !input switch_p1_power
    below: !input thermostat_cutoff_threshold
    for: "00:02:00"
    id: "power_monitor"
  - platform: numeric_state
    entity_id: !input switch_p1_power
    above: !input thermostat_cutoff_threshold
    for: "00:00:15"
    id: "power_monitor"
  - platform: numeric_state
    entity_id: !input switch_p2_power
    below: !input thermostat_cutoff_threshold
    for: "00:02:00"
    id: "power_monitor"
  - platform: numeric_state
    entity_id: !input switch_p2_power
    above: !input thermostat_cutoff_threshold
    for: "00:00:15"
    id: "power_monitor"
  - platform: numeric_state
    entity_id: !input switch_p3_power
    below: !input thermostat_cutoff_threshold
    for: "00:02:00"
    id: "power_monitor"
  - platform: numeric_state
    entity_id: !input switch_p3_power
    above: !input thermostat_cutoff_threshold
    for: "00:00:15"
    id: "power_monitor"

action:
  # Block 1: Resolve all !input references into plain variables for use in templates.
  # HA does not allow !input inside Jinja2 expressions, so every input gets a v_* alias here.
  - variables:
      v_surplus_sensor: !input surplus_sensor
      v_battery_soc_sensor: !input battery_soc_sensor
      v_battery_limit: !input battery_limit
      v_battery_capacity_kwh: !input battery_capacity_kwh
      v_start_time: !input start_time
      v_end_time: !input end_time
      v_hysteresis: !input hysteresis_watts
      v_switch_p1: !input switch_p1
      v_switch_p2: !input switch_p2
      v_switch_p3: !input switch_p3
      v_rod1_kw: !input rod_1_capacity_kw
      v_rod2_kw: !input rod_2_capacity_kw
      v_rod3_kw: !input rod_3_capacity_kw
      v_lock_time: !input lock_time_after_switching
      v_logging: !input enable_logging
      v_p1_power_sensor: !input switch_p1_power
      v_p2_power_sensor: !input switch_p2_power
      v_p3_power_sensor: !input switch_p3_power
      v_cutoff: !input thermostat_cutoff_threshold
      v_grid_sensor: !input grid_sensor
      v_max_grid_import: !input max_grid_import
      v_invert_surplus: !input surplus_sensor_inverted
      v_buffer_temp_sensor: !input buffer_temp_sensor
      v_buffer_temp_threshold: !input buffer_temp_threshold

  # Block 2: Compute per-rod capacity in watts.
  # cap2_w / cap3_w are 0 when the corresponding switch input is left empty (default: {}).
  # Kept in its own block so Block 3 can reference these as resolved variables.
  - variables:
      cap1_w: "{{ v_rod1_kw * 1000 }}"
      cap2_w: "{{ v_rod2_kw * 1000 if v_switch_p2 not in [{}, ''] else 0 }}"
      cap3_w: "{{ v_rod3_kw * 1000 if v_switch_p3 not in [{}, ''] else 0 }}"

  # Block 3: Build all valid rod combinations as a list of dicts.
  # Each entry: {power: W, r1: bool, r2: bool, r3: bool, rods: count}
  # Prefixed with _ to signal that this is an intermediate value consumed by Block 4.
  # Sorted stable by (rods asc, power asc): for equal power the combination using the
  # fewest rods appears first — this is the deduplication tie-breaker used in Block 4.
  - variables:
      _raw_combos: >-
        {%- set c = [] -%}
        {%- set c = c + [{'power': cap1_w, 'r1': true,  'r2': false, 'r3': false, 'rods': 1}] -%}
        {%- if cap2_w > 0 -%}
          {%- set c = c + [{'power': cap2_w,              'r1': false, 'r2': true,  'r3': false, 'rods': 1}] -%}
          {%- set c = c + [{'power': cap1_w + cap2_w,     'r1': true,  'r2': true,  'r3': false, 'rods': 2}] -%}
        {%- endif -%}
        {%- if cap3_w > 0 -%}
          {%- set c = c + [{'power': cap3_w,              'r1': false, 'r2': false, 'r3': true,  'rods': 1}] -%}
          {%- set c = c + [{'power': cap1_w + cap3_w,    'r1': true,  'r2': false, 'r3': true,  'rods': 2}] -%}
          {%- if cap2_w > 0 -%}
            {%- set c = c + [{'power': cap2_w + cap3_w,           'r1': false, 'r2': true,  'r3': true,  'rods': 2}] -%}
            {%- set c = c + [{'power': cap1_w + cap2_w + cap3_w,  'r1': true,  'r2': true,  'r3': true,  'rods': 3}] -%}
          {%- endif -%}
        {%- endif -%}
        {{ c | sort(attribute='rods') | sort(attribute='power') }}

  # Block 4: Deduplicate — for equal power keep only the first entry (fewest rods wins).
  # Result is the stage_table: an ordered list of distinct power levels with their switch targets.
  # Stage index 0 = lowest power, last index = highest power (all off = index -1 by convention).
  - variables:
      stage_table: >-
        {%- set ns = namespace(seen=[], stages=[]) -%}
        {%- for combo in _raw_combos -%}
          {%- if combo.power not in ns.seen -%}
            {%- set ns.seen   = ns.seen   + [combo.power] -%}
            {%- set ns.stages = ns.stages + [combo] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.stages }}

  # Block 5: Read current sensor values and evaluate operating conditions.
  - variables:
      effective_surplus: >-
        {%- set raw = states(v_surplus_sensor) | float(0) -%}
        {{ [raw * -1, 0] | max if v_invert_surplus else [raw, 0] | max }}
      battery_soc: "{{ states(v_battery_soc_sensor) | float(0) }}"
      # Explicit false (not empty-dict) when switch is not configured — avoids ambiguity
      # in downstream boolean expressions.
      sw1_on: "{{ is_state(v_switch_p1, 'on') }}"
      sw2_on: "{{ v_switch_p2 not in [{}, ''] and is_state(v_switch_p2, 'on') }}"
      sw3_on: "{{ v_switch_p3 not in [{}, ''] and is_state(v_switch_p3, 'on') }}"
      in_time_window: >
        {{ now().strftime('%H:%M:%S') >= v_start_time and
           now().strftime('%H:%M:%S') < v_end_time }}
      battery_ok: "{{ battery_soc >= v_battery_limit | float }}"
      # Power readings: -1 sentinel means sensor not configured
      p1_power: "{{ states(v_p1_power_sensor) | float(-1) if v_p1_power_sensor else -1 }}"
      p2_power: "{{ states(v_p2_power_sensor) | float(-1) if v_p2_power_sensor else -1 }}"
      p3_power: "{{ states(v_p3_power_sensor) | float(-1) if v_p3_power_sensor else -1 }}"
      # Thermostat detection: switch ON but power below cutoff threshold
      p1_thermostated: "{{ sw1_on and p1_power >= 0 and p1_power < v_cutoff }}"
      p2_thermostated: "{{ sw2_on and p2_power >= 0 and p2_power < v_cutoff }}"
      p3_thermostated: "{{ sw3_on and p3_power >= 0 and p3_power < v_cutoff }}"
      trigger_is_power_sensor: >
        {{ trigger.platform == 'numeric_state' and
           trigger.entity_id in [v_p1_power_sensor, v_p2_power_sensor, v_p3_power_sensor] }}
      # kWh headroom above the configured minimum SOC — informational only, shown in logs.
      battery_available_kwh: >
        {{ [v_battery_capacity_kwh * (battery_soc - v_battery_limit | float) / 100, 0] | max | round(1) }}

  # Block 6: Read grid sensor value.
  # Kept in its own block so Block 7 can reference grid_power as a resolved variable.
  # Sentinel -9999 means sensor not configured or unavailable — treated as "no import".
  - variables:
      grid_power: >
        {{ states(v_grid_sensor) | float(0)
           if v_grid_sensor and states(v_grid_sensor) not in ['unavailable', 'unknown']
           else -9999 }}

  # Block 7: Evaluate safety conditions.
  - variables:
      grid_import_detected: "{{ v_grid_sensor and grid_power != -9999 and grid_power > v_max_grid_import }}"
      surplus_sensor_invalid: "{{ states(v_surplus_sensor) in ['unavailable', 'unknown'] }}"
      any_rod_on: "{{ sw1_on or sw2_on or sw3_on }}"

  # Emergency safety shutdown — only acts when at least one rod is on.
  - if:
      - condition: template
        value_template: "{{ any_rod_on and (grid_import_detected or surplus_sensor_invalid) }}"
    then:
      - action: switch.turn_off
        target:
          entity_id: >
            {{ [v_switch_p1]
               + ([v_switch_p2] if v_switch_p2 not in [{}, ''] else [])
               + ([v_switch_p3] if v_switch_p3 not in [{}, ''] else []) }}
      - action: logbook.log
        data:
          name: "PV Heating Rod — Emergency Shutdown"
          message: >
            {% if grid_import_detected %}
            Grid import detected: {{ grid_power | round(0) }} W
            (threshold: {{ v_max_grid_import }} W).
            {% else %}
            Surplus sensor is {{ states(v_surplus_sensor) }} — cannot verify safe conditions.
            {% endif %}
            All rods turned off immediately.
            (trigger: {{ trigger.platform }})
          entity_id: "{{ v_switch_p1 }}"
          domain: automation
      - stop: "Emergency safety shutdown — grid import or invalid surplus sensor"

  # Block 8: Combined thermostat monitoring state.
  - variables:
      # True if at least one ON rod has a configured power sensor
      any_on_monitored: >
        {{ (sw1_on and v_p1_power_sensor) or
           (sw2_on and v_p2_power_sensor) or
           (sw3_on and v_p3_power_sensor) }}
      # True if every ON rod that has a power sensor is currently thermostated off
      all_on_monitored_thermostated: >
        {{ any_on_monitored and
           (not sw1_on or not v_p1_power_sensor or p1_thermostated) and
           (not sw2_on or not v_p2_power_sensor or p2_thermostated) and
           (not sw3_on or not v_p3_power_sensor or p3_thermostated) }}

  # Block 9: Determine current stage from switch states.
  # A single loop pass populates both idx and power via a combined dict (_current_stage),
  # avoiding the duplicate iteration that separate variables blocks would require.
  # current_stage_idx = -1 when all rods are off OR when the switch combination is not
  # in the stage_table (e.g. after manual intervention).
  - variables:
      _current_stage: >-
        {%- set ns = namespace(found={'idx': -1, 'power': 0}) -%}
        {%- for stage in stage_table -%}
          {%- if stage.r1 == sw1_on and stage.r2 == sw2_on and stage.r3 == sw3_on -%}
            {%- set ns.found = {'idx': loop.index0, 'power': stage.power} -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.found }}
      current_stage_idx: "{{ _current_stage.idx }}"
      current_stage_power_w: "{{ _current_stage.power }}"

  # Block 10: Calculate raw desired stage index.
  # Finds the highest stage whose required power <= effective_surplus.
  # Result is -1 when surplus is below all stage thresholds (all rods should be off).
  - variables:
      raw_desired_stage_idx: >-
        {%- set ns = namespace(idx=-1) -%}
        {%- for stage in stage_table -%}
          {%- if effective_surplus >= stage.power -%}
            {%- set ns.idx = loop.index0 -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.idx }}

  # Block 11: Apply hysteresis, SOC buffer and resolve final desired stage + target switch states.
  # Hysteresis rule: a stage DOWN only executes when surplus has dropped below
  # (current_stage_power_w - hysteresis). Stages UP are never delayed by hysteresis.
  # SOC buffer: when SOC >= 90% and current stage > Stage 1, stage-down is suppressed on all
  # triggers — the battery absorbs the shortfall. Stage 1 (idx=0) is exempt: drain rate is
  # low enough that it would stay on for 1+ hours, so it switches down immediately.
  # Uses current_stage_idx <= 0 (not a power comparison) so that Stage 1 is correctly
  # identified regardless of which rod has the minimum capacity.
  - variables:
      trigger_allows_stage_down: >
        {{ battery_soc < 90 or current_stage_idx | int <= 0 }}
      desired_stage_idx: >-
        {%- set raw    = raw_desired_stage_idx | int -%}
        {%- set cur    = current_stage_idx | int -%}
        {%- set cur_pw = current_stage_power_w | float -%}
        {%- if raw > cur -%}
          {{- raw -}}
        {%- elif raw < cur -%}
          {%- if effective_surplus < cur_pw - v_hysteresis -%}
            {{- raw -}}
          {%- else -%}
            {{- cur -}}
          {%- endif -%}
        {%- else -%}
          {{- cur -}}
        {%- endif -%}
      desired_stage_combo: >-
        {%- set idx = desired_stage_idx | int -%}
        {%- if idx < 0 or idx >= stage_table | length -%}
          {{ {'power': 0, 'r1': false, 'r2': false, 'r3': false} }}
        {%- else -%}
          {{ stage_table[idx] }}
        {%- endif -%}
      target_p1: "{{ desired_stage_combo.r1 | default(false) }}"
      target_p2: "{{ desired_stage_combo.r2 | default(false) }}"
      target_p3: "{{ desired_stage_combo.r3 | default(false) }}"
      target_power_kw: "{{ (desired_stage_combo.power | default(0) / 1000) | round(1) }}"
      target_stage_num: "{{ desired_stage_idx | int + 1 if desired_stage_idx | int >= 0 else 0 }}"
      current_stage_num: "{{ current_stage_idx | int + 1 if current_stage_idx | int >= 0 else 0 }}"

  # Safeguard: if desired = all-off AND current combination is not in the stage_table
  # (e.g. after manual switch operation), current_stage_idx = -1 and desired_stage_idx = -1,
  # so the normal stage-change check (-1 == -1) would be a no-op. Explicitly turn all
  # rods off in this case to restore a known-good state.
  - if:
      - condition: template
        value_template: >
          {{ desired_stage_idx | int == -1 and
             current_stage_idx | int == -1 and
             any_rod_on }}
    then:
      - action: switch.turn_off
        target:
          entity_id: >
            {{ [v_switch_p1]
               + ([v_switch_p2] if v_switch_p2 not in [{}, ''] else [])
               + ([v_switch_p3] if v_switch_p3 not in [{}, ''] else []) }}
      - stop: "Safeguard — unrecognised switch combination, rods turned off"

  # Power monitoring: buffer tank management with auto-retry cycle
  - if:
      - condition: template
        value_template: "{{ trigger_is_power_sensor }}"
    then:
      - choose:
          # --- CASE 1: all monitored ON rods below threshold for 2+ min → buffer full ---
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.to_state.state | float(999) < v_cutoff and
                     all_on_monitored_thermostated }}
            sequence:
              - variables:
                  retry_wait_minutes: >
                    {{ 60 if v_buffer_temp_sensor not in [{}, '']
                             and states(v_buffer_temp_sensor) | float(0) >= v_buffer_temp_threshold | float
                       else 15 }}
              - if:
                  - condition: template
                    value_template: "{{ v_logging }}"
                then:
                  - action: logbook.log
                    data:
                      name: "PV Heating Rod — Buffer Tank"
                      message: >
                        All active rods have drawn no current for 2+ minutes — buffer tank full.
                        Turning off all rods. Retry in {{ retry_wait_minutes }} minutes.
                      entity_id: "{{ v_switch_p1 }}"
                      domain: automation
              - action: switch.turn_off
                target:
                  entity_id: >
                    {{ [v_switch_p1]
                       + ([v_switch_p2] if v_switch_p2 not in [{}, ''] else [])
                       + ([v_switch_p3] if v_switch_p3 not in [{}, ''] else []) }}
              - delay:
                  minutes: "{{ retry_wait_minutes }}"
              # Re-read all sensors after the wait to get fresh desired stage
              - variables:
                  retry_surplus: >-
                    {%- set raw = states(v_surplus_sensor) | float(0) -%}
                    {{ [raw * -1, 0] | max if v_invert_surplus else [raw, 0] | max }}
                  retry_soc: "{{ states(v_battery_soc_sensor) | float(0) }}"
                  retry_in_window: >
                    {{ now().strftime('%H:%M:%S') >= v_start_time and
                       now().strftime('%H:%M:%S') < v_end_time }}
                  retry_battery_ok: "{{ retry_soc >= v_battery_limit | float }}"
                  retry_desired_stage_idx: >-
                    {%- if not retry_in_window or not retry_battery_ok -%}
                      {{- -1 -}}
                    {%- else -%}
                      {%- set ns = namespace(idx=-1) -%}
                      {%- for stage in stage_table -%}
                        {%- if retry_surplus >= stage.power -%}
                          {%- set ns.idx = loop.index0 -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{- ns.idx -}}
                    {%- endif -%}
                  retry_stage_combo: >-
                    {%- set idx = retry_desired_stage_idx | int -%}
                    {%- if idx < 0 or idx >= stage_table | length -%}
                      {{ {'power': 0, 'r1': false, 'r2': false, 'r3': false} }}
                    {%- else -%}
                      {{ stage_table[idx] }}
                    {%- endif -%}
                  retry_target_p1: "{{ retry_stage_combo.r1 | default(false) }}"
                  retry_target_p2: "{{ retry_stage_combo.r2 | default(false) }}"
                  retry_target_p3: "{{ retry_stage_combo.r3 | default(false) }}"
                  retry_power_kw: "{{ (retry_stage_combo.power | default(0) / 1000) | round(1) }}"
              - if:
                  - condition: template
                    value_template: "{{ retry_desired_stage_idx | int >= 0 }}"
                then:
                  # Turn on at the current desired stage (off-first not needed — all were off)
                  - if:
                      - condition: template
                        value_template: "{{ retry_target_p1 }}"
                    then:
                      - action: switch.turn_on
                        target:
                          entity_id: "{{ v_switch_p1 }}"
                  - if:
                      - condition: template
                        value_template: "{{ retry_target_p2 and v_switch_p2 not in [{}, ''] }}"
                    then:
                      - action: switch.turn_on
                        target:
                          entity_id: "{{ v_switch_p2 }}"
                  - if:
                      - condition: template
                        value_template: "{{ retry_target_p3 and v_switch_p3 not in [{}, ''] }}"
                    then:
                      - action: switch.turn_on
                        target:
                          entity_id: "{{ v_switch_p3 }}"
                  - if:
                      - condition: template
                        value_template: "{{ v_logging }}"
                    then:
                      - action: logbook.log
                        data:
                          name: "PV Heating Rod — Buffer Tank"
                          message: >
                            Retry: Stage {{ retry_desired_stage_idx | int + 1 }}
                            ({{ retry_power_kw }} kW) turned on.
                            Surplus: {{ retry_surplus | round(0) }} W.
                            Checking in 2 minutes whether rods are heating.
                          entity_id: "{{ v_switch_p1 }}"
                          domain: automation
                  - delay: "00:02:00"
                  # Re-read power sensors to evaluate retry result
                  - variables:
                      chk_p1: "{{ states(v_p1_power_sensor) | float(-1) if retry_target_p1 and v_p1_power_sensor else -1 }}"
                      chk_p2: "{{ states(v_p2_power_sensor) | float(-1) if retry_target_p2 and v_p2_power_sensor else -1 }}"
                      chk_p3: "{{ states(v_p3_power_sensor) | float(-1) if retry_target_p3 and v_p3_power_sensor else -1 }}"
                      # At least one retried rod must be above cutoff to count as heating
                      retry_heating: >
                        {{ (retry_target_p1 and v_p1_power_sensor and chk_p1 >= v_cutoff) or
                           (retry_target_p2 and v_p2_power_sensor and chk_p2 >= v_cutoff) or
                           (retry_target_p3 and v_p3_power_sensor and chk_p3 >= v_cutoff) }}
                  - if:
                      - condition: template
                        value_template: "{{ retry_heating }}"
                    then:
                      # Success: buffer is cooling, heating resumed normally
                      - if:
                          - condition: template
                            value_template: "{{ v_logging }}"
                        then:
                          - action: logbook.log
                            data:
                              name: "PV Heating Rod — Buffer Tank"
                              message: >
                                Retry successful — buffer tank cooling, heating resumed at
                                Stage {{ retry_desired_stage_idx | int + 1 }} ({{ retry_power_kw }} kW).
                                Rod 1: {{ chk_p1 | round(0) if chk_p1 >= 0 else 'no sensor' }} W,
                                Rod 2: {{ chk_p2 | round(0) if chk_p2 >= 0 else 'no sensor' }} W,
                                Rod 3: {{ chk_p3 | round(0) if chk_p3 >= 0 else 'no sensor' }} W.
                              entity_id: "{{ v_switch_p1 }}"
                              domain: automation
                    else:
                      # Failed: buffer still full — turn off only the rods that were turned on for retry
                      - if:
                          - condition: template
                            value_template: "{{ retry_target_p1 }}"
                        then:
                          - action: switch.turn_off
                            target:
                              entity_id: "{{ v_switch_p1 }}"
                      - if:
                          - condition: template
                            value_template: "{{ retry_target_p2 and v_switch_p2 not in [{}, ''] }}"
                        then:
                          - action: switch.turn_off
                            target:
                              entity_id: "{{ v_switch_p2 }}"
                      - if:
                          - condition: template
                            value_template: "{{ retry_target_p3 and v_switch_p3 not in [{}, ''] }}"
                        then:
                          - action: switch.turn_off
                            target:
                              entity_id: "{{ v_switch_p3 }}"
                      - if:
                          - condition: template
                            value_template: "{{ v_logging }}"
                        then:
                          - action: logbook.log
                            data:
                              name: "PV Heating Rod — Buffer Tank"
                              message: >
                                Retry failed — buffer still full.
                                Rod 1: {{ chk_p1 | round(0) if chk_p1 >= 0 else 'no sensor' }} W,
                                Rod 2: {{ chk_p2 | round(0) if chk_p2 >= 0 else 'no sensor' }} W,
                                Rod 3: {{ chk_p3 | round(0) if chk_p3 >= 0 else 'no sensor' }} W.
                                Next retry starts when rod power stays below
                                {{ v_cutoff }} W for 2 minutes.
                              entity_id: "{{ v_switch_p1 }}"
                              domain: automation
                else:
                  # No surplus / outside window after 15 min: stay off, log reason
                  - if:
                      - condition: template
                        value_template: "{{ v_logging }}"
                    then:
                      - action: logbook.log
                        data:
                          name: "PV Heating Rod — Buffer Tank"
                          message: >
                            Retry skipped after {{ retry_wait_minutes }} min wait:
                            {{ 'outside time window' if not retry_in_window
                               else 'battery SOC too low (' ~ (retry_soc | round(1)) ~ '%)'
                               if not retry_battery_ok
                               else 'no PV surplus (' ~ (retry_surplus | round(0)) ~ ' W)' }}.
                            Rods stay off.
                          entity_id: "{{ v_switch_p1 }}"
                          domain: automation
              - stop: "Buffer tank retry cycle complete"

          # --- CASE 2: single rod thermostated (not all) — log only ---
          - conditions:
              - condition: template
                value_template: >
                  {{ v_logging and
                     trigger.to_state.state | float(999) < v_cutoff and
                     not all_on_monitored_thermostated }}
            sequence:
              - action: logbook.log
                data:
                  name: "PV Heating Rod — Buffer Tank"
                  message: >
                    {% set rod_name = 'Rod 1' if trigger.entity_id == v_p1_power_sensor
                                      else ('Rod 2' if trigger.entity_id == v_p2_power_sensor
                                      else 'Rod 3') %}
                    {{ rod_name }}: thermostat cut out
                    ({{ trigger.to_state.state | float(0) | round(0) }} W).
                    Other rods still active — buffer not yet full.
                  entity_id: "{{ trigger.entity_id }}"
                  domain: automation

        # --- DEFAULT: power sensor above threshold — rod resumed heating ---
        default:
          - if:
              - condition: template
                value_template: "{{ v_logging }}"
            then:
              - action: logbook.log
                data:
                  name: "PV Heating Rod — Buffer Tank"
                  message: >
                    {% set rod_name = 'Rod 1' if trigger.entity_id == v_p1_power_sensor
                                      else ('Rod 2' if trigger.entity_id == v_p2_power_sensor
                                      else 'Rod 3') %}
                    {{ rod_name }}: resumed heating
                    ({{ trigger.to_state.state | float(0) | round(0) }} W) —
                    buffer tank cooling down.
                  entity_id: "{{ trigger.entity_id }}"
                  domain: automation

  # Main logic: failsafe shutdown or normal stage control
  - if:
      - condition: template
        value_template: "{{ not (in_time_window and battery_ok) }}"
    then:
      # FAILSAFE: outside time window or battery SOC too low — shut everything down.
      # Check actual switch states, not derived current_stage_idx, to catch any invalid
      # switch combination that may have been set manually.
      - if:
          - condition: template
            value_template: "{{ sw1_on or sw2_on or sw3_on }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: >
                {{ [v_switch_p1]
                   + ([v_switch_p2] if v_switch_p2 not in [{}, ''] else [])
                   + ([v_switch_p3] if v_switch_p3 not in [{}, ''] else []) }}
          # Routine shutdowns (end_time, battery limit) go to logbook only — no popup.
          # Only real problems (grid import, sensor fault) get a persistent notification.
          - if:
              - condition: template
                value_template: "{{ v_logging }}"
            then:
              - action: logbook.log
                data:
                  name: "PV Heating Rod — Failsafe"
                  message: >
                    All rods OFF.
                    Reason: {{ 'outside time window' if not in_time_window
                               else 'battery SOC too low ('
                                    ~ (battery_soc | round(1)) ~ '% — '
                                    ~ battery_available_kwh ~ ' kWh above limit / '
                                    ~ v_battery_capacity_kwh ~ ' kWh total)' }}.
                    Surplus: {{ effective_surplus | round(0) }} W (trigger: {{ trigger.platform }})
                  entity_id: "{{ v_switch_p1 }}"
                  domain: automation
    else:
      # NORMAL OPERATION: only act when stage needs to change

      # SOC buffer: stage-down suppressed when battery >= 90% and current stage > Stage 1.
      # See trigger_allows_stage_down in Block 11 for rationale.
      - if:
          - condition: template
            value_template: >
              {{ desired_stage_idx | int < current_stage_idx | int and not trigger_allows_stage_down }}
        then:
          - stop: "Surplus dip — SOC >= 90% and stage > Stage 1, battery buffers until SOC drops below 90%"

      - if:
          - condition: template
            value_template: "{{ desired_stage_idx | int != current_stage_idx | int }}"
        then:
          # Step 1: Turn OFF switches that need to go off first (prevents momentary overshoot)
          - if:
              - condition: template
                value_template: "{{ sw1_on and not target_p1 }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: "{{ v_switch_p1 }}"
          - if:
              - condition: template
                value_template: "{{ sw2_on and not target_p2 }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: "{{ v_switch_p2 }}"
          - if:
              - condition: template
                value_template: "{{ sw3_on and not target_p3 }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: "{{ v_switch_p3 }}"

          # Step 2: Safety delay between switching off and on
          - delay: "00:00:05"

          # Step 3: Turn ON switches that need to go on
          - if:
              - condition: template
                value_template: "{{ not sw1_on and target_p1 }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: "{{ v_switch_p1 }}"
          - if:
              - condition: template
                value_template: "{{ not sw2_on and target_p2 and v_switch_p2 not in [{}, ''] }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: "{{ v_switch_p2 }}"
          - if:
              - condition: template
                value_template: "{{ not sw3_on and target_p3 and v_switch_p3 not in [{}, ''] }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: "{{ v_switch_p3 }}"

          # Step 4: Write stage change to Logbook (if logging enabled)
          - if:
              - condition: template
                value_template: "{{ v_logging }}"
            then:
              - action: logbook.log
                data:
                  name: "PV Heating Rod"
                  message: >
                    Stage {{ target_stage_num }} ({{ target_power_kw }} kW) active
                    (was Stage {{ current_stage_num }}).
                    Surplus: {{ effective_surplus | round(0) }} W,
                    Battery: {{ battery_soc | round(1) }}%
                    ({{ battery_available_kwh }} kWh above limit / {{ v_battery_capacity_kwh }} kWh total).
                    Trigger: {{ trigger.platform }}
                  entity_id: "{{ v_switch_p1 }}"
                  domain: automation

          # Step 5: Lock time — silently ignore new triggers for configured duration
          - delay:
              minutes: "{{ v_lock_time }}"

mode: single
max_exceeded: silent
